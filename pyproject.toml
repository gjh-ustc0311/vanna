[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vanna"
version = "3.0.0"
description = "Local, read-only natural-language assistant for the XPD three-table contract"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.3,<9",
    "fastapi>=0.141,<1",
    "openai>=3.5,<4",
    "pydantic>=2.13,<3",
    "PyMySQL>=1.2,<2",
    "PyYAML>=6,<7",
    "sqlglot>=30.17,<31",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.14,<4",
    "ruff>=0.12,<1",
    "types-PyYAML",
]

[project.scripts]
vanna = "vanna.integrations.xpd.cli:main"

[tool.flit.module]
name = "vanna"
path = "src/vanna"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/integrations/xpd"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv", ".tox", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vanna"]
exclude = ["src/vanna/integrations/xpd/static"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pymysql"
ignore_missing_imports = true
