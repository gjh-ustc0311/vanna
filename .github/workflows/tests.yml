name: XPD checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: |
          pytest -q
          node --test tests/integrations/xpd/xpd-markdown.test.mjs
      - name: Lint and format
        run: |
          ruff format --check src/vanna tests/integrations/xpd
          ruff check src/vanna tests/integrations/xpd
      - name: Type check
        run: mypy src/vanna
      - name: Verify source build
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
