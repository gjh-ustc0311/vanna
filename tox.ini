[tox]
env_list = py, lint, type
isolated_build = true

[testenv]
extras = dev
commands = pytest -q

[testenv:lint]
skip_install = true
deps = ruff>=0.12,<1
commands =
    ruff format --check src/vanna tests/integrations/xpd
    ruff check src/vanna tests/integrations/xpd

[testenv:type]
extras = dev
commands = mypy src/vanna
