[tox]
envlist =
    ruff
    mypy
    py311-unit
    py311-agent-memory-sanity
    py311-anthropic
    py311-openai
    py311-mysql-sanity
    py311-sqlite-sanity
    py311-xpd

[testenv]
deps =
    httpx>=0.28.0
    pytest>=7.0.0
    pytest-asyncio>=0.21.0

[testenv:py311-unit]
description = Run unit tests without external services
commands =
    pytest tests/test_components.py tests/test_agent_progress.py tests/test_tool_permissions.py tests/test_llm_context_enhancer.py tests/test_workflow.py tests/test_memory_tools.py tests/test_supported_surface.py -v

[testenv:py311-agent-memory-sanity]
description = Test the supported local AgentMemory implementation
commands =
    pytest tests/test_agent_memory_sanity.py tests/test_agent_memory.py -v

[testenv:py311-anthropic]
description = Test the Anthropic integration
extras = anthropic
passenv = ANTHROPIC_API_KEY
commands =
    python -c "from vanna.integrations.anthropic import AnthropicLlmService; print('Anthropic import successful')"
    pytest tests/test_agents.py -v -m anthropic

[testenv:py311-openai]
description = Test the OpenAI integration
extras = openai
passenv = OPENAI_API_KEY
commands =
    python -c "from vanna.integrations.openai import OpenAILlmService; print('OpenAI import successful')"
    pytest tests/test_agents.py -v -m openai

[testenv:py311-mysql-sanity]
description = Sanity tests for MySQL
extras = mysql
commands =
    python -c "from vanna.integrations.mysql import MySQLRunner; print('MySQL import successful')"
    pytest tests/test_database_sanity.py::TestMySQLRunner -v

[testenv:py311-sqlite-sanity]
description = Sanity tests for SQLite
commands =
    python -c "from vanna.integrations.sqlite import SqliteRunner; print('SQLite import successful')"
    pytest tests/test_database_sanity.py::TestSqliteRunner -v

[testenv:py311-xpd]
description = Test the local read-only XPD integration
deps =
    {[testenv]deps}
    pytest-mock>=3.10.0
extras =
    xpd
    servers
commands =
    pytest tests/integrations/xpd -v

[testenv:ruff]
description = Check code formatting and linting
extras = dev
commands =
    ruff format --check src/vanna/ tests/ scripts/
    ruff check src/vanna/ tests/ scripts/

[testenv:mypy]
description = Run strict type checking
extras = dev
commands =
    mypy src/vanna/tools src/vanna/core src/vanna/capabilities src/vanna/agents src/vanna/utils src/vanna/web_components src/vanna/components --strict
